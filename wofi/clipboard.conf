# Dedicated clipboard picker configuration.
# Geometry is sized for the 1280x720 logical desktop created by 1.5x scaling.
width=720
height=520
location=center
orientation=vertical
content_halign=fill

matching=fuzzy
insensitive=true
sort_order=default
line_wrap=off

allow_images=true
allow_markup=true
parse_search=true
no_custom_entry=true
image_size=96
cache_file=/dev/null
gtk_dark=true

# Return the original input line number, allowing the UI label to remain clean
# while the script reliably maps the selection back to a cliphist ID.
dmenu-print_line_num=true

key_up=Up,Ctrl-k
key_down=Down,Ctrl-j
key_submit=Return,KP_Enter
key_exit=Escape
