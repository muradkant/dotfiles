# Shared Hyprtoolkit palette
#
# Mirrors the desktop's existing instrument-panel language used by Waybar and
# the clipboard picker: black structure, muted blue active states, Tokyo Night
# accents, monospaced typography, and square geometry.

background = 0xFF000000
base = 0xFF0B0B0D
alternate_base = 0xFF222222

text = 0xFFC0CAF5
bright_text = 0xFFFFFFFF
link_text = 0xFF9ECE6A

accent = 0xFF285577
accent_secondary = 0xFF7DCFFF

font_family = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font Mono

h1_size = 18
h2_size = 14
h3_size = 12
font_size = 12
small_font_size = 10

rounding_large = 0
rounding_small = 0
